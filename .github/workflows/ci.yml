name: FiApp CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. Quality & Linting
  # =========================================================================
  quality:
    name: Code Quality & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install Lint Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.8.6

      - name: Python Compileall Validation
        working-directory: backend
        run: python -m compileall -q src main.py app

      - name: Run Ruff Lint Check
        working-directory: backend
        run: ruff check src main.py tests

  # =========================================================================
  # 2. Backend Unit & Integration Tests (PostgreSQL 16)
  # =========================================================================
  backend:
    name: Backend Tests (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: fiapp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://postgres:ci_test_password@localhost:5432/fiapp_test
      SUPABASE_URL: https://ci-mock.supabase.co
      SUPABASE_ANON_KEY: ci-anon-key-mock
      CORS_ORIGINS: http://localhost:3000
      SQL_ECHO: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Unit Tests (SQLite in-memory & Mocks)
        working-directory: backend
        run: |
          pytest -v -m "not integration"

      - name: Run Integration Tests & Full Suite with Coverage (PostgreSQL 16)
        working-directory: backend
        run: |
          pytest -v --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload Backend Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-report
          path: backend/coverage.xml
          retention-days: 7

  # =========================================================================
  # 3. Frontend (Flutter)
  # =========================================================================
  frontend:
    name: Frontend (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"
          cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:"

      - name: Create Mock .env for Asset Resolution
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Flutter Static Analysis
        run: flutter analyze

      - name: Run Flutter Tests with Coverage
        run: flutter test --coverage

      - name: Upload Flutter Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-coverage-report
          path: frontend/coverage/lcov.info
          retention-days: 7

  # =========================================================================
  # 4. Docker Validation
  # =========================================================================
  docker:
    name: Docker Build & Compose Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Backend Docker Image
        run: docker build -t fiapp-backend:ci backend/

      - name: Create Temporary Dummy .env for Compose Validation
        run: |
          cp backend/.env.example backend/.env

      - name: Validate Docker Compose Configuration
        run: docker compose config

  # =========================================================================
  # 5. Security & Vulnerability Auditing
  # =========================================================================
  security:
    name: Security & Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements-dev.txt

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Audit Backend Dependencies (pip-audit)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit==2.7.3
          pip-audit --requirement requirements.txt || echo "::warning::Vulnerabilidades detectadas en pip-audit, revisar dependencias fijadas."

      - name: Audit Frontend Dependencies (dart pub)
        working-directory: frontend
        run: |
          flutter pub get
          if dart pub --help | grep -q "audit"; then
            dart pub audit || echo "::warning::Avisos encontrados en dart pub audit"
          else
            echo "dart pub audit no disponible en esta versión del SDK, omitiendo comprobación nativa."
          fi
